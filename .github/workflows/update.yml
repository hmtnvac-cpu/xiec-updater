name: Update private Xiec movies

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *' # 07:00 Asia/Ho_Chi_Minh
  workflow_dispatch:

concurrency:
  group: xiec-updater-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout updater
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Patch large JSON readers
        run: node patch-large-json.js

      - name: Scan all 50 source pages and add missing movies
        env:
          XIEC_TOKEN: ${{ secrets.XIEC_TOKEN }}
          TARGET_REPO: hmtnvac-cpu/xiec
          TARGET_PATH: data/ket_qua_1500_phim.json
          SOURCE_URL: https://vlxx.phd/
          MAX_LIST_PAGES: '50'
          MAX_NEW_MOVIES: '10000'
          MAX_REPAIR_MOVIES: '100'
        run: npm run update

      - name: Capture #2 for full catalog
        env:
          XIEC_TOKEN: ${{ secrets.XIEC_TOKEN }}
          TARGET_REPO: hmtnvac-cpu/xiec
          TARGET_PATH: data/ket_qua_1500_phim.json
          STREAM2_LIMIT: '99999'
          STREAM2_CONCURRENCY: '8'
        run: node stream2-test.js
