name: Update private Xiec movies

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: xiec-updater-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout updater
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Full sitemap update with direct #1 + #2
        env:
          XIEC_TOKEN: ${{ secrets.XIEC_TOKEN }}
          TARGET_REPO: hmtnvac-cpu/xiec
          TARGET_PATH: data/ket_qua_1500_phim.json
          SOURCE_URL: https://vlxx.phd/
          FULL_CONCURRENCY: '8'
          CHECKPOINT_EVERY: '10'
        run: node sitemap-full-update.js
