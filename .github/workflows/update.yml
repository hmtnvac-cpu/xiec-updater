name: Discover source menu

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: xiec-updater-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout updater
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Discover authoritative homepage menu
        env:
          SOURCE_URL: https://vlxx.phd/
        run: node discover-site-menu.js
