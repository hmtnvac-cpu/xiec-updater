name: Update private Xiec movies

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *' # 07:00 Asia/Ho_Chi_Minh
  workflow_dispatch:

concurrency:
  group: xiec-updater-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout updater
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test #2 on 10 newest movies in visible Chromium
        env:
          XIEC_TOKEN: ${{ secrets.XIEC_TOKEN }}
          TARGET_REPO: hmtnvac-cpu/xiec
          TARGET_PATH: data/ket_qua_1500_phim.json
          STREAM2_LIMIT: '10'
          STREAM2_CONCURRENCY: '3'
          STREAM2_WAIT_MS: '12000'
        run: xvfb-run -a node stream2-test.js
      - name: Upload stream2 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream2-debug
          path: stream2-debug/
          if-no-files-found: ignore
