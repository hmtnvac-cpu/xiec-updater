name: Update private Xiec movies

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *' # 07:00 Asia/Ho_Chi_Minh
  workflow_dispatch:

concurrency:
  group: xiec-updater-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout updater
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Patch large JSON readers
        run: node patch-large-json.js

      - name: Crawl and update private repo
        env:
          XIEC_TOKEN: ${{ secrets.XIEC_TOKEN }}
          TARGET_REPO: hmtnvac-cpu/xiec
          TARGET_PATH: data/ket_qua_1500_phim.json
          SOURCE_URL: https://vlxx.phd/
          MAX_LIST_PAGES: '3'
          MAX_NEW_MOVIES: '50'
        run: npm run update

      - name: Fast full metadata and streams backfill
        env:
          XIEC_TOKEN: ${{ secrets.XIEC_TOKEN }}
          TARGET_REPO: hmtnvac-cpu/xiec
          TARGET_PATH: data/ket_qua_1500_phim.json
          META_CONCURRENCY: '12'
          STREAM_CONCURRENCY: '6'
          CHECKPOINT_EVERY: '100'
        run: node backfill.js

      - name: Scan and persist all catalog badges
        env:
          XIEC_TOKEN: ${{ secrets.XIEC_TOKEN }}
          TARGET_REPO: hmtnvac-cpu/xiec
          TARGET_PATH: data/ket_qua_1500_phim.json
          SOURCE_URL: https://vlxx.phd/
          MAX_LIST_PAGES: '170'
        run: node scan-vietsub.js
