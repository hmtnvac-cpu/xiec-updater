name: Update private Xiec movies

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: xiec-updater-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout updater
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Discover all movie page URLs from sitemap
        env:
          SOURCE_URL: https://vlxx.phd/
        run: node sitemap-discovery.js
