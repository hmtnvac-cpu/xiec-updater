name: Update private Xiec movies

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: xiec-updater-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout updater
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Pilot direct #1 on 10 newest movies
        env:
          XIEC_TOKEN: ${{ secrets.XIEC_TOKEN }}
          TARGET_REPO: hmtnvac-cpu/xiec
          TARGET_PATH: data/ket_qua_1500_phim.json
          STREAM1_LIMIT: '10'
          STREAM1_CONCURRENCY: '5'
        run: node stream1-test.js
