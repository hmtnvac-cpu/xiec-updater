name: Build full source category map

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: xiec-updater-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  category-map:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout updater
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Crawl every page of each approved category and write map
        env:
          SOURCE_URL: https://vlxx.phd/
          XIEC_TOKEN: ${{ secrets.XIEC_TOKEN }}
          TARGET_REPO: hmtnvac-cpu/xiec
          CATEGORY_PATH: data/site-categories.json
        run: node build-category-map.js
